name: Windows install E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-install-e2e
  cancel-in-progress: false

jobs:
  native-install:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install without credentials or setup
        shell: powershell
        run: |
          $systemPowerShell = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $e2eRoot = Join-Path $env:RUNNER_TEMP 'hermes-easy-setup-e2e'
          $hermesHome = Join-Path $e2eRoot 'hermes'
          $installDir = Join-Path $hermesHome 'hermes-agent'
          $runtimeRoot = Join-Path $e2eRoot 'wizard-runtime'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'HermesEasySetup.ps1'

          New-Item -ItemType Directory -Path $e2eRoot -Force | Out-Null
          $callerGitConfig = Join-Path $e2eRoot 'caller-gitconfig'
          $callerGitAttributes = Join-Path $e2eRoot 'caller-attributes'
          $callerGitAttributesText = "*.mdx text eol=crlf`n"
          [System.IO.File]::WriteAllText($callerGitAttributes, $callerGitAttributesText, (New-Object System.Text.UTF8Encoding($false)))
          $callerAttributesValue = ([System.IO.Path]::GetFullPath($callerGitAttributes)).Replace('\', '/').Replace('"', '\"')
          $callerGitConfigText = "[core]`n`tautocrlf = true`n`tattributesFile = `"$callerAttributesValue`"`n"
          [System.IO.File]::WriteAllText($callerGitConfig, $callerGitConfigText, (New-Object System.Text.UTF8Encoding($false)))
          $env:GIT_CONFIG_GLOBAL = $callerGitConfig

          $hostileGitBin = Join-Path $e2eRoot 'hostile-bin'
          $fakeGitMarker = Join-Path $e2eRoot 'fake-git-executed'
          New-Item -ItemType Directory -Path $hostileGitBin -Force | Out-Null
          $fakeGitText = "@echo off`r`n>`"$fakeGitMarker`" echo hostile-git-executed`r`nexit /b 97`r`n"
          [System.IO.File]::WriteAllText((Join-Path $hostileGitBin 'git.cmd'), $fakeGitText, (New-Object System.Text.ASCIIEncoding))
          $env:PATH = $hostileGitBin + [System.IO.Path]::PathSeparator + $env:PATH
          $hostileCommonDir = Join-Path $e2eRoot 'hostile-common-dir'
          New-Item -ItemType Directory -Path $hostileCommonDir -Force | Out-Null
          $env:GIT_COMMON_DIR = $hostileCommonDir
          $env:GIT_NAMESPACE = 'hermes-e2e-hostile'

          $planText = & $systemPowerShell -NoLogo -NoProfile -ExecutionPolicy Bypass -File $cli -Action Plan -HermesHome $hermesHome -InstallDir $installDir -RuntimeRoot $runtimeRoot -SkipComputerUse -SetupMode Later -Json
          if ($LASTEXITCODE -ne 0) { throw "Plan failed with exit code $LASTEXITCODE" }
          $plan = $planText | ConvertFrom-Json

          & $systemPowerShell -NoLogo -NoProfile -ExecutionPolicy Bypass -File $cli -Action Install -Apply -HermesHome $hermesHome -InstallDir $installDir -RuntimeRoot $runtimeRoot -SkipComputerUse -SetupMode Later -ExpectedPlanFingerprint $plan.Fingerprint -JsonEvents
          $installExit = $LASTEXITCODE

          $verifyText = & $systemPowerShell -NoLogo -NoProfile -ExecutionPolicy Bypass -File $cli -Action Verify -HermesHome $hermesHome -InstallDir $installDir -RuntimeRoot $runtimeRoot -Json
          $verifyExit = $LASTEXITCODE
          $verify = $null
          $verifyFrames = @($verifyText)
          if ($verifyFrames.Count -gt 0) {
            try { $verify = $verifyFrames[-1] | ConvertFrom-Json } catch { Write-Host 'Verify JSON parsing failed.' }
          }
          if ($installExit -ne 0 -or $verifyExit -ne 0 -or $null -eq $verify) {
            $safeDiagnostic = [ordered]@{
              InstallExit = $installExit
              VerifyExit = $verifyExit
              VerifyJsonParsed = ($null -ne $verify)
              Verified = [bool]$verify.Verified
              CommandWorks = [bool]$verify.CommandWorks
              VenvPythonPresent = [bool]$verify.VenvPythonPresent
              CheckoutPresent = [bool]$verify.CheckoutPresent
              CheckoutHeadMatches = [bool]$verify.CheckoutHeadMatches
              OriginOfficial = [bool]$verify.OriginOfficial
              CheckoutClean = [bool]$verify.CheckoutClean
              BootstrapMarker = [bool]$verify.BootstrapMarker
              MarkerMatches = [bool]$verify.MarkerMatches
              GitStatusExitCode = $verify.GitStatusExitCode
              FailedChecks = @($verify.FailedChecks)
              CheckoutStatus = [string]$verify.CheckoutStatus
              CheckoutStatusTruncated = [bool]$verify.CheckoutStatusTruncated
            }
            Write-Host ('Product verification diagnostics: ' + ($safeDiagnostic | ConvertTo-Json -Compress -Depth 4))
            Remove-Item Env:GIT_CONFIG_GLOBAL -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_COMMON_DIR -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_NAMESPACE -ErrorAction SilentlyContinue
            Import-Module (Join-Path $env:GITHUB_WORKSPACE 'src\HermesEasySetup.Loader.psm1') -Force
            $diagnosticGit = Get-HermesVerificationGitPath -HermesHome $hermesHome
            if (-not [string]::IsNullOrWhiteSpace($diagnosticGit) -and (Test-Path -LiteralPath (Join-Path $installDir '.git'))) {
              $diagnosticPlan = [pscustomobject]@{ HermesHome = $hermesHome; RuntimeRoot = $runtimeRoot }
              $diagnosticEnvironment = New-HermesStageEnvironment -Plan $diagnosticPlan -Stage 'repository'
              try {
                $diagnosticProcess = Invoke-HermesProcess -FilePath $diagnosticGit -ArgumentList @('-C', $installDir, 'status', '--porcelain=v1', '--untracked-files=normal') -Environment $diagnosticEnvironment -TimeoutSeconds 60
                $diagnosticCandidates = @($diagnosticProcess.StdOut -split "`r?`n" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 21)
                $diagnosticStatus = Protect-HermesLogText ((@($diagnosticCandidates | Select-Object -First 20)) -join '; ')
                $diagnosticTruncated = ($diagnosticCandidates.Count -gt 20 -or $diagnosticStatus.Length -gt 4096)
                if ($diagnosticStatus.Length -gt 4096) { $diagnosticStatus = $diagnosticStatus.Substring(0, 4096) }
                $diagnosticStatusResult = [ordered]@{ ExitCode = $diagnosticProcess.ExitCode; TimedOut = $diagnosticProcess.TimedOut; Status = $diagnosticStatus; Truncated = $diagnosticTruncated }
                Write-Host ('Independent checkout diagnostics: ' + ($diagnosticStatusResult | ConvertTo-Json -Compress -Depth 3))
              } finally {
                Remove-HermesStageEnvironmentArtifacts -Environment $diagnosticEnvironment -Plan $diagnosticPlan
              }
            }
            throw "Install/Verify failed with exit codes $installExit/$verifyExit"
          }
          if (-not [bool]$verify.Verified -or -not [bool]$verify.CheckoutClean -or -not [bool]$verify.OriginOfficial) { throw 'Product provenance verification did not pass.' }
          Remove-Item Env:GIT_CONFIG_GLOBAL
          Remove-Item Env:GIT_COMMON_DIR
          Remove-Item Env:GIT_NAMESPACE

          $source = Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'config\hermes-source.json') | ConvertFrom-Json
          $marker = Get-Content -Raw -LiteralPath (Join-Path $installDir '.hermes-bootstrap-complete') | ConvertFrom-Json
          if ([string]$marker.pinnedCommit -ne [string]$source.hermes.commitSha) { throw 'Bootstrap marker commit mismatch.' }
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'src\HermesEasySetup.Loader.psm1') -Force
          $git = Get-HermesVerificationGitPath -HermesHome $hermesHome
          if ([string]::IsNullOrWhiteSpace($git)) { throw 'No trusted Git executable is available for provenance checks.' }
          if ([string]$verify.GitPath -ne [string]$git) { throw 'Verify used an unexpected Git executable.' }

          $headText = @(& $git -C $installDir rev-parse HEAD)
          if ($LASTEXITCODE -ne 0) { throw "git rev-parse failed with exit code $LASTEXITCODE" }
          $head = ($headText -join "`n").Trim()
          if ($head -ne [string]$source.hermes.commitSha) { throw 'Checkout HEAD mismatch.' }

          $autocrlfText = @(& $git -C $installDir config --bool --get core.autocrlf)
          if ($LASTEXITCODE -ne 0) { throw "git config failed with exit code $LASTEXITCODE" }
          $autocrlf = ($autocrlfText -join "`n").Trim()
          if ($autocrlf -ne 'false') { throw "Checkout core.autocrlf is '$autocrlf', expected false." }

          $statusText = @(& $git -C $installDir status --porcelain --untracked-files=normal)
          if ($LASTEXITCODE -ne 0) { throw "git status failed with exit code $LASTEXITCODE" }
          if (-not [string]::IsNullOrWhiteSpace(($statusText -join "`n"))) { throw 'Checkout is not clean.' }

          $eolText = @(& $git -C $installDir ls-files --eol -- website/docs/index.mdx)
          if ($LASTEXITCODE -ne 0) { throw "git ls-files --eol failed with exit code $LASTEXITCODE" }
          $eol = ($eolText -join "`n").Trim()
          if ($eol -notmatch '^i/lf\s+w/lf\s+') { throw "Pinned MDX checkout is not LF/LF: $eol" }

          if ([System.IO.File]::ReadAllText($callerGitConfig, [System.Text.Encoding]::UTF8) -cne $callerGitConfigText) { throw 'Caller global Git config was modified.' }
          if ([System.IO.File]::ReadAllText($callerGitAttributes, [System.Text.Encoding]::UTF8) -cne $callerGitAttributesText) { throw 'Caller global Git attributes were modified.' }
          if (Test-Path -LiteralPath $fakeGitMarker) { throw 'Hostile PATH Git was executed.' }
          $staleGitFiles = @(Get-ChildItem -LiteralPath $runtimeRoot -File -Force | Where-Object { $_.Name -match '^git-(?:global-[0-9a-f]{32}\.config|attributes-[0-9a-f]{32}\.txt)$' })
          if ($staleGitFiles.Count -ne 0) { throw 'Ephemeral managed Git files were not removed.' }

          "### Hermes Easy Setup E2E`n`n- Release: $($source.hermes.releaseTag)`n- Peeled commit: $head`n- Hostile PATH/config/common-dir: overridden`n- Checkout EOL: LF/LF`n- Checkout clean: yes`n- Setup/credentials executed: no`n- Result: verified" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
