name: Upstream contract smoke

on:
  pull_request:
    paths:
      - config/hermes-source.json
      - config/hermes-manifest.json
      - src/HermesEasySetup.Core.psm1
      - src/HermesEasySetup.Preflight.psm1
      - src/HermesEasySetup.Protocol.psm1
      - tests/Run-UpstreamContractSmoke.ps1
      - .github/workflows/upstream-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-pin:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify annotated tag, peeled commit, installer blob, and base manifest
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\tests\Run-UpstreamContractSmoke.ps1

      - name: Verify pinned Desktop manifest
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\tests\Run-UpstreamContractSmoke.ps1 -IncludeDesktop
