name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repository packaging allowlist
        shell: powershell
        run: .\tests\Test-RepositoryHygiene.ps1

      - name: PowerShell syntax and encoding
        shell: powershell
        run: .\tests\Test-PowerShellSyntax.ps1

      - name: Unit tests on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Run-Tests.ps1

      - name: Security regression tests
        shell: powershell
        run: .\tests\Run-SecurityTests.ps1

      - name: CLI contract tests
        shell: powershell
        run: .\tests\Run-CliTests.ps1

      - name: WPF smoke test
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\Run-GuiTests.ps1

      - name: Unit tests on PowerShell 7
        shell: pwsh
        run: .\tests\Run-Tests.ps1

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
