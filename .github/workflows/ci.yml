name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repository packaging allowlist
        shell: powershell
        run: .\tests\Test-RepositoryHygiene.ps1

      - name: PowerShell syntax and encoding
        shell: powershell
        run: .\tests\Test-PowerShellSyntax.ps1

      - name: Unit tests on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Run-Tests.ps1

      - name: Security regression tests
        shell: powershell
        run: .\tests\Run-SecurityTests.ps1

      - name: CLI contract tests
        shell: powershell
        run: .\tests\Run-CliTests.ps1

      - name: WPF smoke test
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\Run-GuiTests.ps1

      - name: Dashboard readiness and authentication regression tests
        shell: powershell
        run: .\tests\Run-LabDashboardTests.ps1

      - name: Mattermost Desktop registration and installer regression tests
        shell: powershell
        run: .\tests\Run-MattermostTests.ps1

      - name: Mattermost Desktop tests on PowerShell 7
        shell: pwsh
        run: .\tests\Run-MattermostTests.ps1

      - name: Unit tests on PowerShell 7
        shell: pwsh
        run: .\tests\Run-Tests.ps1

      - name: Mattermost admin safety and resume tests
        shell: powershell
        run: .\tests\Run-AdminTests.ps1

      - name: Mattermost admin tests on PowerShell 7
        shell: pwsh
        run: .\tests\Run-AdminTests.ps1

      - name: Mattermost admin WPF smoke test
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File .\HermesAdminSetup.Gui.ps1 -SmokeTest

      - name: Admin bot issuance and recovery tests (PowerShell 5.1)
        shell: powershell
        run: .\tests\Run-AdminBotTests.ps1

      - name: Admin bot issuance and recovery tests (PowerShell 7)
        shell: pwsh
        run: .\tests\Run-AdminBotTests.ps1

      - name: NetBird scope recovery and user connection checks (PowerShell 5.1)
        shell: powershell
        run: |
          .\tests\Run-AdminNetworkTests.ps1
          .\tests\Run-LabConnectionTests.ps1

      - name: NetBird scope recovery and user connection checks (PowerShell 7)
        shell: pwsh
        run: |
          .\tests\Run-AdminNetworkTests.ps1
          .\tests\Run-LabConnectionTests.ps1

      - name: Separate distributions, checksums, and extracted GUI smoke tests
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\Run-DistributionTests.ps1

      - name: Local four-agent research setup tests
        shell: powershell
        run: |
          .\tests\Run-DockerTests.ps1
          .\tests\Run-DockerCliTests.ps1
          .\tests\Run-ResearchTests.ps1
          .\tests\Run-ResearchRuntimeTests.ps1
          powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File .\HermesResearchSetup.Gui.ps1 -SmokeTest

      - name: Local research tests on PowerShell 7
        shell: pwsh
        run: |
          .\tests\Run-DockerTests.ps1
          .\tests\Run-ResearchTests.ps1
          .\tests\Run-ResearchRuntimeTests.ps1

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
